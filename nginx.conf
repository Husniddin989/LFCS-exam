server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # v86 BIOS + small assets — upstream copy.sh doesn't set CORS headers
    location /v86-cdn/ {
        rewrite ^/v86-cdn/(.*)$ /v86/$1 break;
        proxy_pass https://copy.sh;
        proxy_set_header Host copy.sh;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # v86 kernel images — Bunny CDN with hotlink protection, forge Referer
    location /v86-img/ {
        rewrite ^/v86-img/(.*)$ /$1 break;
        proxy_pass https://i.copy.sh;
        proxy_set_header Host i.copy.sh;
        proxy_set_header Referer "https://copy.sh/v86/";
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
