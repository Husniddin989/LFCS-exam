services:
  lfcs-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lfcs-platform
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app=lfcs-platform"
      - "env=production"

  # Development service (optional)
  lfcs-dev:
    image: node:20-alpine
    container_name: lfcs-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
    environment:
      - NODE_ENV=development

networks:
  default:
    name: lfcs-network
