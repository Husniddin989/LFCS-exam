services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lfcs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lfcs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lfcs_password}
      POSTGRES_DB: ${POSTGRES_DB:-lfcs_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lfcs_user} -d ${POSTGRES_DB:-lfcs_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lfcs-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lfcs-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lfcs-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lfcs-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-lfcs_user}:${POSTGRES_PASSWORD:-lfcs_password}@postgres:5432/${POSTGRES_DB:-lfcs_platform}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lfcs-network
    restart: unless-stopped
    labels:
      - "app=lfcs-platform"
      - "component=backend"

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api/v1}
    container_name: lfcs-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lfcs-network
    restart: unless-stopped
    labels:
      - "app=lfcs-platform"
      - "component=frontend"

  # Database Admin (dev only)
  adminer:
    image: adminer:latest
    container_name: lfcs-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - lfcs-network
    profiles:
      - dev
    restart: unless-stopped

volumes:
  postgres_data:
    name: lfcs-postgres-data
  redis_data:
    name: lfcs-redis-data

networks:
  lfcs-network:
    name: lfcs-network
    driver: bridge
